<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gaming Journey Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎮 Your Gaming Journey</h1>

  <div class="form">
    <input type="text" id="game" placeholder="Game title" />
    <input type="text" id="year" placeholder="Year or age" />
    <select id="mood">
      <option value="fun">Fun</option>
      <option value="challenging">Challenging</option>
      <option value="nostalgic">Nostalgic</option>
      <option value="competitive">Competitive</option>
    </select>
    <button onclick="addGame()">Add to Journey</button>
  </div>

  <div id="timeline"></div>

  <script src="script.js"></script>
</body>
</html>
